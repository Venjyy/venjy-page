<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio · Venjy</title>
    <link rel="preload" href="../font/pixelcraft.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="estudio.css">
</head>
<body>
    <header class="barra">
        <h1 data-es="Estudio" data-en="Studio">Estudio</h1>
        <nav class="pestanas" aria-label="Secciones">
            <button class="pestana activa" type="button" data-pestana="layout" data-es="Layout" data-en="Layout">Layout</button>
            <button class="pestana" type="button" disabled data-es="Textos · fase 3" data-en="Texts · phase 3">Textos · fase 3</button>
            <button class="pestana" type="button" disabled data-es="Posiciones · fase 4" data-en="Positions · phase 4">Posiciones · fase 4</button>
            <button class="pestana" type="button" disabled data-es="Escenas · fase 5" data-en="Scenes · phase 5">Escenas · fase 5</button>
            <button class="pestana" type="button" disabled data-es="Poses · fase 6" data-en="Poses · phase 6">Poses · fase 6</button>
        </nav>
        <span id="estado-servidor" class="estado" data-es="Buscando servidor…" data-en="Looking for server…">Buscando servidor…</span>
        <div class="idiomas" role="group" aria-label="Idioma">
            <button class="boton chico" type="button" data-idioma="es">ES</button>
            <button class="boton chico" type="button" data-idioma="en">EN</button>
        </div>
    </header>

    <p id="aviso-pantalla" class="aviso-pantalla" data-es="Abre el Estudio en el computador: el editor necesita una pantalla de al menos 900 px de ancho."
       data-en="Open the Studio on a computer: the editor needs a screen at least 900 px wide.">Abre el Estudio en el computador: el editor necesita una pantalla de al menos 900 px de ancho.</p>

    <main id="seccion-layout" class="seccion">
        <section class="escritorio">
            <div class="fila-aparato">
                <label class="campo">
                    <span data-es="Aparato" data-en="Device">Aparato</span>
                    <select id="aparato"></select>
                </label>
                <label class="campo corto" id="campo-w" hidden>
                    <span data-es="Ancho" data-en="Width">Ancho</span>
                    <input id="pers-w" type="number" min="240" max="1400" value="800">
                </label>
                <label class="campo corto" id="campo-h" hidden>
                    <span data-es="Alto" data-en="Height">Alto</span>
                    <input id="pers-h" type="number" min="240" max="1400" value="400">
                </label>
                <label class="casilla-marca">
                    <input id="zona-segura" type="checkbox">
                    <span data-es="Zona segura (muesca)" data-en="Safe area (notch)">Zona segura (muesca)</span>
                </label>
                <span id="perfil-actual" class="etiqueta-perfil"></span>
            </div>
            <div id="marco" class="marco">
                <div id="escenario" class="escenario">
                    <iframe id="vista" title="Vista táctil" src="vista-tactil.html"></iframe>
                    <div id="capa" class="capa"></div>
                </div>
            </div>
            <p class="ayuda" data-es="Arrastra un botón para moverlo; la esquina marcada lo agranda. Flechas: 1 px (Mayús: 10). Ctrl+Z deshace."
               data-en="Drag a button to move it; the marked corner resizes it. Arrows: 1 px (Shift: 10). Ctrl+Z undoes.">Arrastra un botón para moverlo; la esquina marcada lo agranda. Flechas: 1 px (Mayús: 10). Ctrl+Z deshace.</p>
        </section>

        <aside class="lateral">
            <section class="panel" id="panel-elegido">
                <h2 id="titulo-elegido" data-es="Elige un botón" data-en="Pick a button">Elige un botón</h2>
                <div id="campos" class="campos"></div>
                <button id="restablecer" class="boton chico" type="button" hidden data-es="Restablecer este botón" data-en="Reset this button">Restablecer este botón</button>
            </section>
            <section class="panel">
                <h2 data-es="Botones" data-en="Buttons">Botones</h2>
                <ul id="lista" class="lista-botones"></ul>
            </section>
            <section class="panel">
                <h2 data-es="Avisos" data-en="Warnings">Avisos</h2>
                <ul id="avisos" class="avisos"></ul>
            </section>
            <section class="panel acciones">
                <label class="campo">
                    <span data-es="Franja inferior (pie, px)" data-en="Bottom strip (pie, px)">Franja inferior (pie, px)</span>
                    <input id="campo-pie" type="number" min="0" max="400" step="1">
                </label>
                <div class="fila-botones">
                    <button id="deshacer" class="boton chico" type="button" data-es="Deshacer" data-en="Undo">Deshacer</button>
                    <button id="descartar" class="boton chico" type="button" data-es="Descartar cambios" data-en="Discard changes">Descartar cambios</button>
                </div>
                <div class="fila-botones">
                    <button id="guardar" class="boton" type="button" disabled data-es="Guardar" data-en="Save">Guardar</button>
                    <button id="descargar" class="boton secundario" type="button" data-es="Descargar JSON" data-en="Download JSON">Descargar JSON</button>
                </div>
                <p id="mensaje" class="mensaje" role="status"></p>
            </section>
        </aside>
    </main>

    <script type="module" src="estudio.js"></script>
</body>
</html>
